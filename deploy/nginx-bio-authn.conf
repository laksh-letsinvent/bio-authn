server {
    listen 80;
    server_name bio-authn.letsinvent.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bio-authn.letsinvent.co.uk;

    # --- TLS (certbot will populate these) ---
    ssl_certificate     /etc/letsencrypt/live/bio-authn.letsinvent.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bio-authn.letsinvent.co.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- document root: the portal/ directory in the repo ---
    root /var/www/bio-authn/portal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|json|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
